AWSTemplateFormatVersion: '2010-09-09'
Description: One bounded explicit-lean Linux pilot; all resources are owned by this stack.

Parameters:
  ImageId:
    Type: AWS::EC2::Image::Id
    AllowedPattern: '^ami-[0-9a-f]+$'
    Description: Fresh Amazon Linux 2023 x86_64 AMI selected by the controller.
  RootDeviceName:
    Type: String
    AllowedPattern: '^/dev/[A-Za-z0-9]+$'
    Description: Root device name returned by the selected AMI.
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetId:
    Type: AWS::EC2::Subnet::Id
  RunId:
    Type: String
    AllowedPattern: '^[0-9]{8}T[0-9]{6}Z-[0-9a-f]{32}$'
  NotAfter:
    Type: String
    AllowedPattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}$'
    Description: Exact UTC deadline without the trailing Z.
  RepoUrl:
    Type: String
    AllowedPattern: '^https://github\.com/Barraketh/explicit-lean\.git/?$'
  AuthorizationRef:
    Type: String
    AllowedPattern: '^[0-9a-f]{40}$'

Resources:
  PilotSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      GroupDescription: SSM egress-only security group for the bounded pilot.
      VpcId:
        Ref: VpcId
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Project
          Value: explicit-lean
        - Key: Pilot
          Value: aws-linux-pilot
        - Key: RunId
          Value:
            Ref: RunId
        - Key: AuthorizationRef
          Value:
            Ref: AuthorizationRef

  InstanceRole:
    Type: AWS::IAM::Role
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: PutOnlyThisRunEvidence
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: PutOnlyThisRunEvidence
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:AbortMultipartUpload
                Resource:
                  Fn::Sub: arn:aws:s3:::explicit-lean-reports-538639825139-us-east-1/aws-linux-pilot/${RunId}/*
      Tags:
        - Key: Project
          Value: explicit-lean
        - Key: Pilot
          Value: aws-linux-pilot
        - Key: RunId
          Value:
            Ref: RunId
        - Key: AuthorizationRef
          Value:
            Ref: AuthorizationRef

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Roles:
        - Ref: InstanceRole

  PilotInstance:
    Type: AWS::EC2::Instance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      ImageId:
        Ref: ImageId
      InstanceType: r7i.4xlarge
      Tenancy: default
      EbsOptimized: true
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 1
      IamInstanceProfile:
        Ref: InstanceProfile
      NetworkInterfaces:
        - DeviceIndex: '0'
          SubnetId:
            Ref: SubnetId
          GroupSet:
            - Ref: PilotSecurityGroup
          AssociatePublicIpAddress: true
          DeleteOnTermination: true
      BlockDeviceMappings:
        - DeviceName:
            Ref: RootDeviceName
          Ebs:
            VolumeType: gp3
            VolumeSize: 200
            Encrypted: true
            DeleteOnTermination: true
      InstanceInitiatedShutdownBehavior: terminate
      UserData:
        Fn::Base64:
          Fn::Sub: |
            #!/bin/bash
            set -euo pipefail
            install -d -m 0755 /var/lib/explicit-lean-pilot
            cat > /etc/systemd/system/explicit-lean-pilot-shutdown.service <<'UNIT'
            [Unit]
            Description=Independent guest backup shutdown for the explicit-lean pilot
            DefaultDependencies=no
            After=local-fs.target

            [Service]
            Type=oneshot
            ExecStart=/usr/bin/systemctl poweroff
            UNIT
            cat > /etc/systemd/system/explicit-lean-pilot-shutdown.timer <<'UNIT'
            [Unit]
            Description=Guest backup deadline for explicit-lean pilot

            [Timer]
            OnCalendar=${NotAfter} UTC
            AccuracySec=1s
            Persistent=true
            Unit=explicit-lean-pilot-shutdown.service

            [Install]
            WantedBy=timers.target
            UNIT
            printf '%s\n' '${NotAfter}Z' > /var/lib/explicit-lean-pilot/shutdown-deadline
            printf '%s\n' '${RunId}' > /var/lib/explicit-lean-pilot/shutdown-run-id
            chmod 0644 /var/lib/explicit-lean-pilot/shutdown-deadline /var/lib/explicit-lean-pilot/shutdown-run-id
            systemctl daemon-reload
            systemctl enable --now explicit-lean-pilot-shutdown.timer
            touch /var/lib/explicit-lean-pilot/shutdown-installed
            install -d -m 0755 /opt/openai-codex/0.154.0 /usr/local/bin
            curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 'https://registry.npmjs.org/@openai/codex/-/codex-0.154.0-linux-x64.tgz' -o /tmp/codex-0.154.0-linux-x64.tgz
            test "$(sha512sum /tmp/codex-0.154.0-linux-x64.tgz | cut -d' ' -f1)" = '6b8148dc0f2c1adc06aceaa5b6b3dbad2da16a3ac7406e7dd44c2645f891a0b31bd74571741b54196e20bba20955810d898180ee4dcfe239511c4a02654fecf5'
            tar -xzf /tmp/codex-0.154.0-linux-x64.tgz --directory /opt/openai-codex/0.154.0
            ln -sfn /opt/openai-codex/0.154.0/package/vendor/x86_64-unknown-linux-musl/bin/codex /usr/local/bin/codex
            test -x /usr/local/bin/codex
            /usr/local/bin/codex --version
            rm -f /tmp/codex-0.154.0-linux-x64.tgz
            dnf install -y git python3 jq
            test ! -e /var/lib/explicit-lean-pilot/auth-checkout
            git clone --no-checkout '${RepoUrl}' /var/lib/explicit-lean-pilot/auth-checkout
            git -C /var/lib/explicit-lean-pilot/auth-checkout checkout --detach '${AuthorizationRef}'
            test "$(git -C /var/lib/explicit-lean-pilot/auth-checkout rev-parse HEAD)" = '${AuthorizationRef}'
            test "$(git -C /var/lib/explicit-lean-pilot/auth-checkout remote get-url origin)" = '${RepoUrl}'
            test -z "$(git -C /var/lib/explicit-lean-pilot/auth-checkout status --porcelain --untracked-files=all)"
            chown -R root:root /var/lib/explicit-lean-pilot/auth-checkout
            chmod 0700 /var/lib/explicit-lean-pilot/auth-checkout
      Tags:
        - Key: Name
          Value:
            Fn::Sub: explicit-lean-pilot-${RunId}
        - Key: Project
          Value: explicit-lean
        - Key: Pilot
          Value: aws-linux-pilot
        - Key: RunId
          Value:
            Ref: RunId
        - Key: AuthorizationRef
          Value:
            Ref: AuthorizationRef
        - Key: NotAfter
          Value:
            Fn::Sub: ${NotAfter}Z
        - Key: WorkerCount
          Value: '1'

  TerminationRole:
    Type: AWS::IAM::Role
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: '538639825139'
      Policies:
        - PolicyName: TerminateOnlyPilotInstance
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: TerminateOnlyThisInstance
                Effect: Allow
                Action: ec2:TerminateInstances
                Resource:
                  Fn::Sub: arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/${PilotInstance}
      Tags:
        - Key: Project
          Value: explicit-lean
        - Key: Pilot
          Value: aws-linux-pilot
        - Key: RunId
          Value:
            Ref: RunId

  TerminationSchedule:
    Type: AWS::Scheduler::Schedule
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Description: One-time AWS-side termination at the approved pilot deadline.
      FlexibleTimeWindow:
        Mode: 'OFF'
      ScheduleExpression:
        Fn::Sub: at(${NotAfter})
      ScheduleExpressionTimezone: UTC
      State: ENABLED
      Target:
        Arn: arn:aws:scheduler:::aws-sdk:ec2:terminateInstances
        RoleArn:
          Fn::GetAtt:
            - TerminationRole
            - Arn
        Input:
          Fn::Sub: '{"InstanceIds":["${PilotInstance}"]}'
        RetryPolicy:
          MaximumEventAgeInSeconds: 60
          MaximumRetryAttempts: 0

Outputs:
  InstanceId:
    Value:
      Ref: PilotInstance
  EvidencePrefix:
    Value:
      Fn::Sub: aws-linux-pilot/${RunId}/
  NotAfter:
    Value:
      Fn::Sub: ${NotAfter}Z
  TerminationScheduleArn:
    Value:
      Fn::GetAtt:
        - TerminationSchedule
        - Arn
