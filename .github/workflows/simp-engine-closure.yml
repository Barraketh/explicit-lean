name: Schema-16 full Mathlib closure

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full immutable commit SHA to test
        required: true
        type: string
      shard_count:
        description: Number of deterministic module shards
        required: true
        default: "256"
        type: string
      max_parallel:
        description: Maximum simultaneous shard jobs
        required: true
        default: "2"
        type: string
      module_timeout:
        description: Per-module compile timeout in seconds
        required: true
        default: "900"
        type: string
      module_prefix:
        description: Optional Mathlib/ module prefix
        required: true
        default: "Mathlib/"
        type: string
  # A workflow_dispatch file is not callable until it reaches the default
  # branch. This dedicated run ref lets the reviewed pre-merge commit execute
  # once; deleting the remote ref prevents accidental repeat full-corpus runs.
  push:
    branches:
      - simp-engine-cloud-run

permissions:
  contents: read
  actions: read

concurrency:
  group: simp-engine-closure-${{ github.sha }}
  cancel-in-progress: false

env:
  TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_sha || github.sha }}
  SHARD_COUNT: ${{ inputs.shard_count || '256' }}
  MODULE_TIMEOUT: ${{ inputs.module_timeout || '900' }}
  MODULE_PREFIX: ${{ inputs.module_prefix || 'Mathlib/' }}

jobs:
  inventory:
    name: Pin, local gate, and inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Check out exact commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1

      - name: Restore pinned Lean and Mathlib caches
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          auto-config: false
          build: false
          test: false
          use-github-cache: true
          use-mathlib-cache: true

      - name: Verify reviewed local gate
        run: Experiment/run.sh

      - name: Inventory every supported occurrence once
        run: |
          python3 Experiment/simp_engine_cloud.py inventory \
            --commit "$TARGET_SHA" \
            --module-prefix "$MODULE_PREFIX" \
            --output .cloud/inventory/inventory.json

      - name: Construct deterministic shard matrix
        id: matrix
        run: |
          matrix=$(python3 Experiment/simp_engine_cloud.py matrix --shard-count "$SHARD_COUNT")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

      - name: Upload immutable inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: simp-engine-inventory
          path: .cloud/inventory/inventory.json
          if-no-files-found: error
          retention-days: 14

  shard:
    name: Shard ${{ matrix.shard }}
    needs: inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel || '2') }}
      matrix:
        shard: ${{ fromJSON(needs.inventory.outputs.matrix) }}
    steps:
      - name: Check out exact commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1

      - name: Restore pinned Lean and Mathlib caches
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          auto-config: false
          build: false
          test: false
          use-github-cache: true
          use-mathlib-cache: true

      - name: Download immutable inventory
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: simp-engine-inventory
          path: .cloud/inventory

      - name: Record and materialize assigned modules
        run: |
          python3 Experiment/simp_engine_cloud.py shard \
            --inventory .cloud/inventory/inventory.json \
            --shard-index "${{ matrix.shard }}" \
            --shard-count "$SHARD_COUNT" \
            --module-timeout "$MODULE_TIMEOUT" \
            --stop-after-failure \
            --output-dir ".cloud/shard-${{ matrix.shard }}"

      - name: Upload checkpointed shard report and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: simp-engine-shard-${{ matrix.shard }}
          path: |
            .cloud/shard-${{ matrix.shard }}/reports
            .cloud/shard-${{ matrix.shard }}/logs
            .cloud/shard-${{ matrix.shard }}/failures
          if-no-files-found: error
          compression-level: 6
          retention-days: 14

  reduce:
    name: Require total closure
    if: always()
    needs:
      - inventory
      - shard
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1

      - name: Download immutable inventory
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: simp-engine-inventory
          path: .cloud/inventory

      - name: Download all available shard artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: simp-engine-shard-*
          path: .cloud/shards

      - name: Merge reports and require every terminal
        id: reduce
        run: |
          python3 Experiment/simp_engine_cloud.py reduce \
            --inventory .cloud/inventory/inventory.json \
            --reports-dir .cloud/shards \
            --shard-count "$SHARD_COUNT" \
            --output-dir .cloud/final

      - name: Publish Markdown summary
        if: always() && hashFiles('.cloud/final/simp-engine-closure.md') != ''
        run: cat .cloud/final/simp-engine-closure.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload merged closure and all failure diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: simp-engine-closure
          path: |
            .cloud/final
            .cloud/shards/*/failures
            .cloud/shards/*/logs
          if-no-files-found: warn
          compression-level: 6
          retention-days: 14
